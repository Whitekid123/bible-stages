<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Download Bible Stages</title>
    <style>
      :root {
        --bg: #243f3c;
        --fg: #f3efe4;
        --muted: rgb(243 239 228 / 0.75);
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--fg);
        font-family: "Source Sans 3", system-ui, sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      h1 {
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        line-height: 0.92;
        margin: 0 0 16px;
      }
      p {
        max-width: 28rem;
        line-height: 1.5;
        color: var(--muted);
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 56px;
        width: min(100%, 28rem);
        margin-top: 24px;
        border-radius: 12px;
        background: var(--fg);
        color: var(--bg);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <p style="letter-spacing: 0.16em; text-transform: uppercase; font-size: 0.8rem">Get the app</p>
      <h1>Bible Stages</h1>
      <p>Tap download on an Android phone, then Install. Open the Bible Stages icon after that.</p>
      <a class="btn" href="/BibleStages.apk" download="BibleStages.apk">Download the app</a>
    </main>
  </body>
</html>
