plugins {
    id "com.android.application"
}

android {
    namespace "com.biblestages.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.biblestages.app"
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
