name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android platform
        run: |
          SDK="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDK" ]; then SDK="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"; fi
          yes | "$SDK" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/BibleStages.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BibleStages
          path: dist/BibleStages.apk
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-1.0
          name: Bible Stages Android app
          files: dist/BibleStages.apk
          fail_on_unmatched_files: true
          body: |
            Install this on an Android phone:

            1. Download BibleStages.apk
            2. Open the file
            3. Allow install from this source if Android asks
            4. Open Bible Stages
            5. Paste the class hall address once
